<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e13;
        color: #d7dde8;
      }
      #nova-container {
        position: absolute;
        inset: 0;
      }
      #nova-container canvas {
        display: block;
      }
      #nova-ui {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 16px;
        background: rgba(13, 17, 24, 0.86);
        border: 1px solid #2a3140;
        border-radius: 8px;
        min-width: 210px;
        user-select: none;
        /* Step 10AT: at 360x640 the panel's content exactly fills the viewport
           (measured), so a shorter window would clip the last line. Scroll the
           overlay instead of clipping it. */
        box-sizing: border-box;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
      }
      #nova-ui h1 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.18em;
        color: #d9a441;
      }
      #nova-ui-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #btn-hud {
        font-size: 10px;
        letter-spacing: 0.08em;
        padding: 2px 6px;
      }
      /* Step 10BA: at narrow viewports a HUD that cannot be hidden covers the
         board — and therefore the cells the player must click. Collapsing keeps
         the header and the status line (the placement/refusal feedback) and
         hides only the panels, which stay one click away. State is DOM-only:
         nothing about the HUD is persisted. */
      #nova-ui.collapsed .row,
      #nova-ui.collapsed #scenario,
      #nova-ui.collapsed #selected-building,
      #nova-ui.collapsed #progression,
      #nova-ui.collapsed .stats {
        display: none;
      }
      #nova-ui .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #nova-ui button,
      #nova-ui select {
        box-sizing: border-box;
        max-width: 100%;
        background: #1a202b;
        color: #d7dde8;
        border: 1px solid #2a3140;
        border-radius: 5px;
        padding: 5px 10px;
        cursor: pointer;
        font-size: 12px;
      }
      #nova-ui button:hover,
      #nova-ui select:hover {
        border-color: #d9a441;
      }
      #nova-ui button[aria-pressed="true"] {
        border-color: #d9a441;
        color: #d9a441;
      }
      #nova-ui .stats {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 12px;
        font-size: 12px;
        color: #9aa4b5;
      }
      #nova-ui .stats span {
        color: #d7dde8;
        text-align: right;
      }
      #ui-status {
        font-size: 11px;
        color: #7fd1c8;
        min-height: 14px;
        max-width: 320px;
        line-height: 1.35;
      }
      #progression {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 320px;
        padding-top: 6px;
        border-top: 1px solid #2a3140;
      }
      #progression .stats {
        font-size: 12px;
      }
      #ui-objective {
        font-size: 11px;
        color: #d9a441;
        line-height: 1.35;
        white-space: pre-line;
      }
      #ui-objective-status {
        font-size: 11px;
        color: #9aa4b5;
        line-height: 1.35;
      }
      #ui-progress,
      #ui-blocked {
        font-size: 11px;
        color: #9aa4b5;
        line-height: 1.35;
        white-space: pre-line;
      }
      #ui-blocked {
        color: #d98f8f;
      }
      #scenario {
        width: 100%;
        max-width: 190px;
        box-sizing: border-box;
      }
      #selected-building {
        font-size: 12px;
        color: #9aa4b5;
        /* Step 10AT: the inspection lines can be long ("Material production —
           producing +2/tick (staffed) · jobs 1/1 · upkeep 1/tick ·
           storage 25"). Without a cap the overlay widens and covers the
           top-left board cells, which are real click targets; wrap instead. */
        max-width: 320px;
        overflow-wrap: anywhere;
      }
      #selected-building b {
        color: #d9a441;
      }
      /* Step 10BA: at narrow viewports the content-sized overlay used to take
         ~95-96% of the viewport width, hiding the board (and therefore the
         cells the player has to click). Cap its share of the width, tighten the
         padding and the type a notch, and let long lines wrap: every causal
         information stays reachable, the board stays visible. */
      @media (max-width: 560px) {
        #nova-ui {
          top: 8px;
          left: 8px;
          gap: 6px;
          padding: 8px 10px;
          max-width: 58vw;
          max-height: calc(100vh - 16px);
          font-size: 12px;
        }
        #nova-ui h1 {
          font-size: 13px;
        }
        #ui-status,
        #progression,
        #selected-building {
          max-width: none;
        }
        #scenario {
          max-width: 100%;
        }
        #nova-ui .row,
        #nova-ui button,
        #nova-ui select {
          font-size: 11px;
        }
        #nova-ui .stats {
          font-size: 11px;
          gap: 2px 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="nova-container" data-testid="nova-viewport"></div>
    <div id="nova-ui">
      <div id="nova-ui-header">
        <h1>NOVA</h1>
        <button
          id="btn-hud"
          data-testid="hud-toggle"
          type="button"
          aria-expanded="true"
          aria-controls="nova-ui"
          title="Show or hide the HUD panels (the status line stays visible)"
        >HIDE</button>
      </div>
      <div id="selected-building" data-testid="building-inspection">
        <div>Building: <b id="ins-type" data-testid="inspection-type">[ none ]</b></div>
        <div id="ins-status" data-testid="inspection-status">No building selected</div>
        <div id="ins-construction" data-testid="inspection-construction"></div>
        <div id="ins-housing" data-testid="inspection-housing"></div>
        <div id="ins-worker" data-testid="inspection-worker"></div>
        <div id="ins-crew" data-testid="inspection-crew"></div>
      </div>
      <div class="row" id="reassign-row" style="display: none">
        <select id="reassign-target" data-testid="reassign-target" aria-label="reassignment target"></select>
        <button id="btn-reassign" type="button" data-testid="reassign-confirm">Move worker</button>
      </div>
      <div class="row" id="crew-row" style="display: none">
        <select id="crew-target" data-testid="crew-target" aria-label="construction crew"></select>
        <button id="btn-crew" type="button" data-testid="crew-confirm">Assign crew</button>
        <button id="btn-crew-release" type="button" data-testid="crew-release">Release</button>
      </div>
      <div class="row">
        <button id="btn-play" type="button" data-testid="simulation-play">PLAY</button>
        <button id="btn-pause" type="button" data-testid="simulation-pause">PAUSE</button>
        <button id="btn-step" type="button" data-testid="simulation-step">STEP</button>
        <select id="speed" aria-label="simulation speed">
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
        </select>
      </div>
      <div class="row" role="group" aria-label="building selection">
        <button id="btn-build-residence" type="button" data-testid="build-residence" aria-pressed="true">Residence · 25</button>
        <button id="btn-build-farm" type="button" data-testid="build-farm" aria-pressed="false">Farm · 25</button>
        <button id="btn-build-workshop" type="button" data-testid="build-workshop" aria-pressed="false">Workshop · 25</button>
        <button id="btn-build-well" type="button" data-testid="build-well" aria-pressed="false">Well · 25</button>
      </div>
      <div class="row" role="group" aria-label="mobility selection">
        <button id="btn-build-road" type="button" data-testid="build-road" aria-pressed="false">Road · 5</button>
      </div>
      <div class="row">
        <select id="scenario" data-testid="scenario-select" aria-label="scenario" title="scenario"></select>
      </div>
      <div id="progression" data-testid="progression">
        <div class="stats">
          <div>Stage:</div><span id="ui-stage" data-testid="progression-stage">Wilderness</span>
          <div>Next:</div><span id="ui-next-stage" data-testid="progression-next">Settlement</span>
        </div>
        <div id="ui-objective" data-testid="progression-objective"></div>
        <div id="ui-objective-status" data-testid="progression-objective-status"></div>
        <div id="ui-progress" data-testid="progression-progress"></div>
        <div id="ui-blocked" data-testid="progression-blocked"></div>
      </div>
      <div class="stats">
        <div>Tick:</div><span id="ui-tick" data-testid="stat-tick">0</span>
        <div>Material:</div><span><span id="ui-construction" data-testid="stat-construction">100</span><span id="ui-material-status" data-testid="stat-material-status"></span></span>
        <div>Material reserve:</div><span id="ui-storage-material" data-testid="stat-storage-material">0 / 40 · 15 protected</span>
        <div>Food:</div><span><span id="ui-food" data-testid="stat-food">100</span><span id="ui-food-forecast" data-testid="stat-food-forecast"></span></span>
        <div>Water:</div><span><span id="ui-water" data-testid="stat-water">0</span><span id="ui-water-status" data-testid="stat-water-status"></span></span>
        <div>Residences:</div><span id="ui-residences" data-testid="stat-residences">0 / 0 served</span>
        <div id="ui-terrain-label" style="display: none">Terrain:</div><span id="ui-terrain" data-testid="stat-terrain" style="display: none"></span>
        <div>Buildings:</div><span id="ui-buildings" data-testid="stat-buildings">0</span>
        <div>Operational:</div><span id="ui-operational" data-testid="stat-operational">0</span>
        <div>Colonists:</div><span id="ui-colonists" data-testid="stat-colonists">0</span>
        <div>Jobs:</div><span id="ui-jobs" data-testid="stat-jobs">0 / 0</span>
        <div>Roads:</div><span id="ui-roads" data-testid="stat-roads">0</span>
      </div>
      <div id="ui-status" data-testid="ui-status"></div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
